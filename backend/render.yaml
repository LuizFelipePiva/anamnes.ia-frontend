# =============================================
# render.yaml — Deploy do backend no Render.com
# Docs: https://render.com/docs/blueprint-spec
# =============================================

services:
  - type: web
    name: anamnes-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    branch: master

    # Render injeta $PORT automaticamente (10000 por padrão)
    healthCheckPath: /api/health

    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_VECTOR_STORE_ID
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: LANGFUSE_PUBLIC_KEY
        sync: false
      - key: LANGFUSE_SECRET_KEY
        sync: false
      - key: LANGFUSE_BASE_URL
        value: https://us.cloud.langfuse.com
      - key: ALLOWED_ORIGINS
        sync: false
      - key: LOG_LEVEL
        value: INFO
