name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]

jobs:
  # ─────────────────────────────────────────
  # Backend → Render
  # Secret: RENDER_DEPLOY_HOOK_URL
  #   Render dashboard → service → Settings → Deploy Hook
  # ─────────────────────────────────────────
  deploy-backend:
    name: Deploy Backend (Render)
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Trigger Render deploy hook
        run: curl -fsSL -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

  # ─────────────────────────────────────────
  # Frontend → Vercel
  # Secrets required:
  #   VERCEL_TOKEN   → vercel.com/account/tokens
  #   VERCEL_ORG_ID  → vercel.com/account (team id) or personal account id
  #   VERCEL_PROJECT_ID → project settings → general → Project ID
  # ─────────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend (Vercel)
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/anamnes-ia/package-lock.json

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Pull Vercel environment
        run: vercel pull --cwd frontend/anamnes-ia --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --cwd frontend/anamnes-ia --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        run: vercel deploy --cwd frontend/anamnes-ia --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
