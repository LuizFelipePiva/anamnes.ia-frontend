name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  # ─────────────────────────────────────────
  # Frontend: typecheck + lint
  # ─────────────────────────────────────────
  frontend:
    name: Frontend (tsc + eslint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/anamnes-ia

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/anamnes-ia/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc -b --noEmit

      - name: Lint
        run: npm run lint

  # ─────────────────────────────────────────
  # Backend: syntax + ruff lint
  # ─────────────────────────────────────────
  backend:
    name: Backend (ruff + py_compile + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v5

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        # ruff pinado + ruleset explícito em backend/pyproject.toml ([tool.ruff.lint]),
        # então o comportamento é determinístico e independe dos defaults do ruff
        # (que mudam entre versões). Ao subir o pin, rode `ruff check app/` local
        # e trate os findings novos antes de mergear.
        run: pip install -r requirements.txt "ruff==0.16.0" "pytest==9.1.1"

      - name: Lint (ruff)
        run: ruff check app/

      - name: Syntax check
        run: python -m compileall app/ -q

      # A suíte não toca serviço externo: `tests/conftest.py` injeta env dummy,
      # mocka o cliente Supabase (inclusive nas chamadas diretas, que escapam do
      # `dependency_overrides`) e blinda o cliente da OpenAI. Roda em ~3s.
      - name: Tests (pytest)
        run: pytest -q
